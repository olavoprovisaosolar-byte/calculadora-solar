name: Build Solar Calculator APK

on:
  push:
    branches:
      - main
      - master
      - 'cursor/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native Android project
        env:
          EXPO_NO_TELEMETRY: '1'
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Sign release builds with stable keystore
        run: python3 scripts/patch-android-release-signing.py android/app/build.gradle

      - name: Verify stable signing config in Gradle
        run: |
          grep -q "signingConfigs.release" android/app/build.gradle
          test -f android/app/solar-calculator.keystore
          test -f android/keystore.properties
          echo "Stable signing files present"

      - name: Unlock orientation for tablets (TL10)
        run: python3 scripts/patch-android-orientation.py android/app/src/main/AndroidManifest.xml

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK (JS bundle embedded)
        working-directory: android
        env:
          NODE_ENV: production
          EXPO_NO_TELEMETRY: '1'
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy APK artifact
        run: |
          mkdir -p artifact
          APK_PATH=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          APK_NAME=$(node scripts/apk-file-name.mjs)
          echo "Using APK: $APK_PATH as $APK_NAME"
          cp "$APK_PATH" "artifact/${APK_NAME}"
          ls -lh "artifact/${APK_NAME}"
          unzip -l "artifact/${APK_NAME}" | grep -Ei 'index\.(android\.)?bundle|\.hbc|assets/.*js' | head -40 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar-calculator-apk
          path: artifact/SolarCalculator-v*.apk
          retention-days: 30
